# appId bleibt bewusst gleich: So ersetzt der Installer eine vorhandene Zeittracker-Installation.
appId: de.zeittracker.app
productName: Timetracker
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/node_modules/**/*'
win:
  target: nsis
  icon: resources/icon.ico
  artifactName: Timetracker-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Timetracker
  deleteAppDataOnUninstall: false
